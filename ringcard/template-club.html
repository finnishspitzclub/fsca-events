<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e7e9ee; --muted:#a3a9b4; --faint:#727984;
    --line:#2a2f39; --paper:#0f1216; --card:#181c23;
    --warn:#e8b562; --warn-bg:#2a2313; --warn-br:#5a4a24;
    --rc0:#8b5cf6; --rc1:#10b981; --rc2:#f59e0b; --rc3:#22b8cf;
    --rc4:#fb7185; --rc5:#6b8afd; --rc6:#d0a020; --rc7:#2dd4bf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased;padding:0 0 48px}
  .wrap{max-width:620px;margin:0 auto;padding:0 14px}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

  header{padding:22px 0 4px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.02}
  .sub{font-size:13px;color:var(--muted);margin-top:6px}
  .rlegend{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 8px 4px 11px}
  .chip .cbreed{font-weight:700;letter-spacing:-.01em}
  .ringchip{display:inline-flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:#fff;border-radius:20px;padding:2px 8px}
  .ringchip.rc0{background:var(--rc0)} .ringchip.rc1{background:var(--rc1)} .ringchip.rc2{background:var(--rc2)} .ringchip.rc3{background:var(--rc3)}
  .ringchip.rc4{background:var(--rc4)} .ringchip.rc5{background:var(--rc5)} .ringchip.rc6{background:var(--rc6)} .ringchip.rc7{background:var(--rc7)}

  .bar{position:sticky;top:0;z-index:20;background:rgba(15,18,22,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-top:16px}
  .bar-in{max-width:620px;margin:0 auto;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card)}
  .seg button{font-family:inherit;font-size:12px;font-weight:600;border:none;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}
  .seg button.act{background:var(--ink);color:var(--paper)}
  .seg button:focus-visible{outline:2px solid var(--rc5);outline-offset:2px}
  .seg .lbl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:0 4px 0 8px;align-self:center}

  .day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:16px;overflow:hidden}
  .day-head{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  .day-head .d{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .day-head .d span{color:var(--faint);font-weight:600;margin-left:7px;font-size:13px}

  .row{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:start}
  .row:last-child{border-bottom:none}
  .time{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;padding-top:1px;font-variant-numeric:tabular-nums}
  .breed{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .ahead{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.35}
  .ahead b{color:var(--muted);font-weight:700}
  .tags{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
  .tag{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 6px;border-radius:5px}
  .tag.warn{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-br);cursor:help}
  .right{text-align:right;white-space:nowrap}
  .ring{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 8px}
  .ring.rc0{background:var(--rc0)} .ring.rc1{background:var(--rc1)} .ring.rc2{background:var(--rc2)} .ring.rc3{background:var(--rc3)}
  .ring.rc4{background:var(--rc4)} .ring.rc5{background:var(--rc5)} .ring.rc6{background:var(--rc6)} .ring.rc7{background:var(--rc7)}
  .ent{font-size:13px;color:var(--muted);margin-top:6px}
  .ent .mono{font-size:10px;color:var(--faint);display:block;margin-top:1px}
  .none{padding:13px 16px;font-size:13px;color:var(--faint)}

  .groups{background:#12151b;border-top:1px solid var(--line);padding:12px 16px 13px}
  .glabel{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:9px;display:flex;align-items:center;gap:6px}
  .glabel::before{content:"";height:1px;width:14px;background:var(--faint);opacity:.5}
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:2px 18px}
  .grow{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;padding:7px 0}
  .gord{display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:#fff;border-radius:20px;padding:3px 0;min-width:34px;margin-top:1px}
  .gord.rc0{background:var(--rc0)} .gord.rc1{background:var(--rc1)} .gord.rc2{background:var(--rc2)} .gord.rc3{background:var(--rc3)}
  .gord.rc4{background:var(--rc4)} .gord.rc5{background:var(--rc5)} .gord.rc6{background:var(--rc6)} .gord.rc7{background:var(--rc7)}
  .gname{font-size:13px;font-weight:700;margin-bottom:3px}
  .gline{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);padding:1px 0}
  .gline .gj{flex:1;min-width:0}
  .glab{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.02em;padding:1px 5px;border-radius:4px;background:var(--line);color:var(--muted);flex:none}
  .glab.n{background:#3b4250;color:#fff}
  .gt{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ink);flex:none}
  .gt.mut{color:var(--faint);font-weight:600}
  /* compact end-of-day group table: order · group · Regular judge · Owner-Handled judge · est time */
  .glist{display:grid;gap:1px;margin-top:2px}
  .ghead,.grow2{display:grid;grid-template-columns:36px minmax(96px,1fr) 1.05fr 1.05fr auto;gap:9px;align-items:center}
  .ghead{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:0 6px 4px}
  .grow2{padding:4px 6px;border-radius:7px;font-size:12px}
  .grow2.gmine{background:rgba(139,92,246,.15);box-shadow:inset 3px 0 0 var(--rc0)}
  .gnm{font-weight:700;letter-spacing:-.01em}
  .gmine .gnm{color:#fff}
  .gstar{color:var(--rc0);font-size:11px}
  .gj2{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow2.gmine .gj2{color:var(--ink)}
  .gj2 .em{color:var(--faint);font-weight:700;font-size:9px;letter-spacing:.04em;text-transform:uppercase;margin-right:4px}
  .gtime{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ink);text-align:right;white-space:nowrap}
  .row.fs{box-shadow:inset 3px 0 0 var(--rc0)}

  .note{font-size:12px;color:var(--faint);margin-top:20px;line-height:1.55}
  .note b{color:var(--muted)}
  @media (max-width:400px){.row{grid-template-columns:60px 1fr auto;gap:8px}h1{font-size:26px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
    <div class="rlegend" id="legend"></div>
  </header>
</div>

<div class="bar"><div class="bar-in">
  <div class="seg"><span class="lbl">Time</span>
    <button id="tSlot">Slot</button><button id="tEst" class="act">Est.</button>
  </div>
</div></div>

<div class="wrap">
  <div id="days"></div>
  <p class="note" id="note"></p>
</div>

<script>
/* ===== data injected by render.js (intermediate.json + fsca-weekend.json) =====
   Club variant: Finnish Spitz only. render.js still injects its full DATA blob
   (warnings/clash arrays included), but this template simply ignores the
   personal pieces — no "Other dogs" toggle, no cross-breed clash banners. ===== */
const DATA = /*__DATA__*/ null /*__END_DATA__*/;
/* ============================================================================ */

const {show, legend, ringClass, days:DAYS, R, G, note} = DATA;
const rc = ring => ringClass[ring] || 'rc0';
let S = {time:'e'};

document.title = [show.eyebrow, show.title].filter(Boolean).join(' · ') || 'Ring Card';
document.getElementById('eyebrow').textContent = show.eyebrow;
document.getElementById('title').textContent = show.title;
document.getElementById('sub').textContent = show.sub;
document.getElementById('legend').innerHTML = legend.map(l =>
  `<span class="chip"><span class="cbreed">${l.breed}</span>${(l.rings||(l.ring!=null?[l.ring]:[])).map(r =>
    `<span class="ringchip ${rc(r)}">Ring ${r}</span>`).join('')}</span>`).join('');
document.getElementById('note').innerHTML = note;

function aheadLine(r){
  if(r.flag) return `running order not parsed — <b>check the program</b>`;
  if(r.ahead===0) return `<b>first</b> in the ring`;
  const base = `<b>${r.ahead}</b> ahead`;
  return r.prev!=null ? `${base} · after <b>${r.prev}</b> ×${r.prevN}` : base;
}

function renderDays(){
  let h='';
  for(let d=0;d<DAYS.length;d++){
    let rows = R.filter(r=>r.day===d);
    rows.sort((a,b)=>(S.time==='e'?a.eM-b.eM:a.sM-b.sM));
    h+=`<section class="day"><div class="day-head"><div class="d">${DAYS[d][0]}<span>${DAYS[d][1]}</span></div></div>`;
    if(!rows.length){
      h+=`<div class="none">No Finnish Spitz scheduled this day.</div>`;
    }
    for(const r of rows){
      let tags = r.flag ? `<div class="tags"><span class="tag warn" title="${r.flag}">⚠ verify</span></div>` : '';
      let t = S.time==='e' ? r.eL : r.sL;
      let fscls = /finnish spitz/i.test(r.breed) ? ' fs' : '';
      h+=`<div class="row${fscls}">
        <div class="time">${t}</div>
        <div><div class="breed">${r.breed}</div><div class="meta">${r.judge}</div>
          <div class="ahead">${aheadLine(r)}</div>${tags}</div>
        <div class="right"><span class="ring ${rc(r.ring)}">Ring ${r.ring}</span>
        <div class="ent">${r.ent}${r.sub?`<span class="mono">${r.sub}</span>`:''}</div></div>
      </div>`;
    }
    let g = G[d];
    if(g && g.groups && g.groups.length){
      let glab = `End-of-day groups · ${S.time==='e' ? 'est. times from '+g.start : 'order from '+g.start}`;
      h+=`<div class="groups"><div class="glabel">${glab}</div><div class="glist">`;
      h+=`<div class="ghead"><span></span><span>Group</span><span>Regular</span><span>Owner-Handled</span><span>Est.</span></div>`;
      for(const x of g.groups){
        // Non-Sporting is always the Finnish Spitz group; x.mine also catches any
        // added breeds' group on days they run.
        let ghl = x.mine || /^\s*non-sporting\s*$/i.test(x.grp);
        h+=`<div class="grow2${ghl?' gmine':''}">
          <span class="gord ${rc(x.ring)}">${x.ord}</span>
          <span class="gnm">${x.grp}${ghl?' <span class="gstar">★</span>':''}</span>
          <span class="gj2">${x.reg||'—'}</span>
          <span class="gj2">${x.nohs||'—'}</span>
          <span class="gtime">${x.estL}</span>
        </div>`;
      }
      h+=`</div></div>`;
    }
    h+=`</section>`;
  }
  document.getElementById('days').innerHTML = h;
}

function bind(id,fn){let e=document.getElementById(id);e.addEventListener('click',fn);}
bind('tSlot',()=>{S.time='s';document.getElementById('tSlot').classList.add('act');document.getElementById('tEst').classList.remove('act');renderDays();});
bind('tEst',()=>{S.time='e';document.getElementById('tEst').classList.add('act');document.getElementById('tSlot').classList.remove('act');renderDays();});
renderDays();
</script>
</body>
</html>
